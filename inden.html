<!DOCTYPE html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalender PRO</title><style>body{font-family:Arial,sans-serif;margin:0;background:#111;color:#eee}header{background:#222;padding:12px}main{padding:16px}.card{background:#1c1c1c;padding:15px;border-radius:10px;margin:10px 0}input,button{padding:8px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #444;padding:6px}th{background:#333}</style></head><body><header><h1>🏺 Kalender PRO</h1></header><main><div class=card><h2>Datoopslag</h2><input type=date id=d><button onclick=calc()>Beregn</button><div id=o></div></div><div class=card><h2>Kalendere</h2><table><tr><th>Kalender</th><th>Værdi</th></tr><tr><td>Babylonisk</td><td>Nisanu → Addaru</td></tr><tr><td>Hebraisk</td><td>Nisan → Adar</td></tr><tr><td>Romersk</td><td>Ianuarius → December</td></tr></table></div></main><script>const bab=['Addaru','Nisanu','Ajaru','Simanu','Tammuz','Abu','Ululu','Tashritu','Arahsamna','Kislimu','Tebetu','Shabatu'];function moon(dt){const lp=29.53058867;const base=new Date('2000-01-06');const days=(dt-base)/86400000;const age=((days%lp)+lp)%lp;if(age<1)return'🌑 Nymåne';if(age<7)return'🌒';if(age<9)return'🌓';if(age<15)return'🌔';if(age<16)return'🌕 Fuldmåne';if(age<22)return'🌖';if(age<24)return'🌗';return'🌘';}function calc(){let v=document.getElementById('d').value;if(!v)return;let dt=new Date(v);let m=dt.getMonth()+1;document.getElementById('o').innerHTML='<p><b>Moderne:</b> '+v+'</p><p><b>Babylonisk:</b> '+bab[m%12]+'</p><p><b>Hebraisk:</b> Demonstrationsvisning</p><p><b>Romersk måned:</b> '+m+'</p><p><b>Månefase:</b> '+moon(dt)+'</p>';}</script></body></html>
